version: '3'

volumes:
  pg_data:
  static:
  media:

services:
  db:
    image: postgres:13
    env_file: .env
    volumes:
      - pg_data:/var/lib/postgresql/data

  backend:
    image: igorpanda/foodgram_backend:latest
    container_name: foodgram-backend
    restart: always
    env_file:
      - .env
    volumes:
      - static_value:/backend_static
      - media_value:/app/media/
    depends_on:
      - db

  frontend:
    image: igorpanda/kittygram_frontend
    env_file: .env
    command: cp -r /app/build/. /frontend_static/
    volumes:
      - static:/frontend_static

  gateway:
    image: igorpanda/kittygram_gateway
    env_file: .env
    ports:
      - 9000:80
    volumes:
      - static:/staticfiles
      - media:/media
    depends_on:
      - backend
